<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f3">
  <title>Joy's Vocabulary</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183436;
      --muted: #52696a;
      --paper: #f4f7f3;
      --line: #cfdbd4;
      --teal: #087e78;
      --coral: #dc684e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 36px, 820px);
      margin: 0 auto;
      padding: 64px 0;
    }

    header { border-bottom: 2px solid var(--ink); padding-bottom: 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--teal); font-size: 13px; font-weight: 700; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 38px; }
    .links { display: grid; gap: 12px; margin-top: 22px; }

    a {
      display: flex;
      min-height: 74px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--teal);
      border-radius: 6px;
      padding: 16px 20px;
      background: #fff;
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    a:last-child { border-left-color: var(--coral); }
    a:hover { border-color: var(--teal); background: #f9fcfa; }
    a span:last-child { color: var(--muted); font-size: 24px; }

    @media (max-width: 600px) {
      main { padding-top: 40px; }
      h1 { font-size: 32px; }
      a { min-height: 68px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">TUESDAY · NONFICTION</p>
      <h1>Joy's Vocabulary</h1>
    </header>
    <nav class="links" aria-label="Vocabulary pages">
      <a href="nonfiction/tuesday_word_cards_child.html"><span>아이와 연습</span><span aria-hidden="true">→</span></a>
      <a href="nonfiction/tuesday_word_cards.html"><span>부모용 단어 정리</span><span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
