<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Nonfiction Word Practice</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183436;
      --muted: #52696a;
      --paper: #f4f7f3;
      --line: #cfdbd4;
      --teal: #087e78;
      --coral: #dc684e;
      --yellow: #e2ae36;
      --blue: #557e9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    main {
      width: min(100% - 32px, 1040px);
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--teal);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
    }

    .counter { color: var(--muted); font-size: 16px; font-weight: 700; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid #bfcfc8;
      border-radius: 18px;
      background: #fff;
      color: var(--teal);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-btn:hover {
      border-color: var(--teal);
      background: #f0f7f4;
    }

    .nav-btn:active {
      background: #e2f0ea;
      transform: scale(0.96);
    }

    .home-btn {
      color: #3b5250;
    }

    .refresh-button svg {
      transition: transform 0.3s ease;
    }

    .refresh-button:active svg {
      transform: rotate(180deg);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 4px;
      background: #dce6df;
    }

    progress {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      appearance: none;
    }

    progress::-webkit-progress-bar { background: #dce6df; }
    progress::-webkit-progress-value { background: var(--teal); }
    progress::-moz-progress-bar { background: var(--teal); }

    .word-panel {
      display: grid;
      grid-template-columns: minmax(220px, 0.85fr) minmax(0, 1.15fr);
      align-items: start;
      gap: 36px;
      min-height: 560px;
      padding: 32px;
      border: 1px solid var(--line);
      border-top: 5px solid var(--teal);
      border-radius: 8px;
      background: #fff;
    }

    .scene {
      width: min(100%, 260px);
      aspect-ratio: 11 / 15;
      justify-self: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background-image: url("images/Gemini_Generated_Image_ubono3ubono3ubon.png");
      background-repeat: no-repeat;
      background-size: 500% 200%;
    }

    .word-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .pronounce-button {
      display: grid;
      width: 48px;
      height: 48px;
      min-height: 48px;
      flex: 0 0 48px;
      place-items: center;
      border-color: var(--line);
      border-radius: 50%;
      padding: 0;
      color: var(--teal);
    }

    .pronounce-button svg { width: 24px; height: 24px; }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .part {
      border-radius: 4px;
      padding: 5px 9px;
      background: #e7f2ed;
      color: #255b53;
      font-size: 15px;
      font-weight: 700;
    }

    .question { margin: 16px 0 22px; color: var(--muted); font-size: 21px; }

    button {
      min-height: 52px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      padding: 11px 18px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #edf5f0; }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    button:disabled { opacity: 0.42; cursor: default; }

    .word-copy { display: flex; flex-direction: column; }
    .meaning { border-top: 1px solid var(--line); padding-top: 16px; }
    .section-label { margin: 0 0 4px; color: var(--teal); font-size: 15px; font-weight: 700; text-transform: uppercase; }
    .answer-text { margin: 0; font-size: 20px; }
    .meaning .answer-text { color: var(--ink); font-weight: 600; }

    .hint-sections {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .hint-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hint-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 16px;
      background: #f8faf7;
      color: var(--ink);
      font-weight: 700;
      text-align: left;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .hint-button::after {
      content: "▼";
      font-size: 11px;
      color: var(--teal);
      transition: transform 0.2s ease;
    }

    .hint-button[aria-expanded="true"] {
      border-color: var(--teal);
      background: #eaf3f0;
      color: var(--teal);
    }

    .hint-button[aria-expanded="true"]::after {
      transform: rotate(180deg);
    }

    .hint-answer {
      display: none;
      margin: 0;
      padding: 12px 16px;
      border-radius: 6px;
      background: #f4f8f6;
      border-left: 4px solid var(--teal);
      color: var(--ink);
      font-size: 19px;
      line-height: 1.45;
    }

    .hint-answer.is-visible {
      display: block !important;
    }

    nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    @media (max-width: 620px) {
      main { padding-top: 18px; padding-bottom: 260px; }
      header { align-items: start; }
      .word-panel { grid-template-columns: 1fr; gap: 20px; min-height: 0; padding: 20px; }
      .scene { width: min(100%, 190px); }
      h2 { font-size: 42px; }
      .question { margin: 11px 0 16px; }
    }

    @media print {
      .progress-track, nav { display: none; }
      main { width: 100%; padding: 0; }
      .word-panel { border: 0; padding: 0; }
      .hint-button { border: 0; padding: 0; background: transparent; }
      .hint-answer { height: auto; flex-basis: auto; overflow: visible; visibility: visible; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Nonfiction · Unit 4-2</p>
        <h1>Word Practice</h1>
      </div>
      <div class="header-actions">
        <a class="nav-btn home-btn" href="../index.html" title="메인 홈으로 이동" aria-label="홈으로">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>홈으로</span>
        </a>
        <button class="nav-btn refresh-button" id="refresh-button" type="button" onclick="hardRefresh()" title="최신 단어 카드로 새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          <span>새로고침</span>
        </button>
        <span class="counter" id="counter" aria-live="polite">01 / 10</span>
      </div>
    </header>

    <div class="progress-track">
      <progress id="progress" value="1" max="10" aria-label="Word progress">1 of 10</progress>
    </div>

    <section class="word-panel" aria-live="polite">
      <div class="scene" id="scene" role="img" aria-label="Vocabulary illustration"></div>
      <div class="word-copy">
        <div class="word-meta">
          <h2 id="word">fantastic</h2>
          <span class="part" id="part">adjective</span>
          <button class="pronounce-button" id="pronounce-button" type="button" aria-label="Hear pronunciation for fantastic" title="Hear pronunciation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
          </button>
        </div>
        <p class="question">What does it mean?</p>
        <section class="meaning">
          <p class="section-label">Meaning</p>
          <p class="answer-text" id="book-meaning"></p>
        </section>
        <div class="hint-sections" aria-label="Extra vocabulary hints">
          <section class="hint-section">
            <button class="hint-button" id="simple-button" type="button" aria-expanded="false" aria-controls="simple-answer"><span>In simple words</span></button>
            <p class="answer-text hint-answer" id="simple-answer" aria-hidden="true"></p>
          </section>
          <section class="hint-section">
            <button class="hint-button" id="example-button" type="button" aria-expanded="false" aria-controls="example-answer"><span>Example</span></button>
            <p class="answer-text hint-answer" id="example-answer" aria-hidden="true"></p>
          </section>
        </div>
      </div>
    </section>

    <nav aria-label="Word navigation">
      <button id="previous-button" type="button" aria-label="Previous word">← Previous</button>
      <button id="next-button" type="button" aria-label="Next word">Next →</button>
    </nav>
  </main>

  <script>
    const words = [
      {
        word: "fantastic",
        part: "adjective",
        book: "Very good, great.",
        simple: "Fantastic means really wonderful, great, and exciting!",
        example: "The amazing performance at the concert last night was absolutely fantastic!",
        image: "A fantastic concert performance with cheering audience"
      },
      {
        word: "fairy",
        part: "noun",
        book: "A small magical creature with wings.",
        simple: "A fairy is a cute little magical person with wings.",
        example: "The children were delighted to discover a magical fairy hiding among the flowers in the garden.",
        image: "A magical winged fairy on a flower"
      },
      {
        word: "tale",
        part: "noun",
        book: "An old story.",
        simple: "A tale is an exciting old story or fairy tale.",
        example: "The boy's mother read him a bedtime tale to help him sleep.",
        image: "Reading a bedtime storybook tale"
      },
      {
        word: "tiny",
        part: "adjective",
        book: "Very small.",
        simple: "Tiny means something that is very, very small and little.",
        example: "Look at that tiny mouse! It's so small and cute!",
        image: "A tiny cute mouse sitting on a clover"
      },
      {
        word: "actually",
        part: "adverb",
        book: "Truthfully, in a real way.",
        simple: "Actually means really, truthfully, or in real life.",
        example: "Actually, I did see him at the party last night, even if he said he didn't see me.",
        image: "Discovering the truth with an honest smile"
      },
      {
        word: "peculiar",
        part: "adjective",
        book: "Strange, unusual.",
        simple: "Peculiar means unusual, strange, or quirky in a special way.",
        example: "The old house had a peculiar charm, with its crooked windows and overgrown garden.",
        image: "A peculiar whimsical old cottage"
      },
      {
        word: "feathery",
        part: "adjective",
        book: "Light and soft, like a feather.",
        simple: "Feathery means soft, light, and fluffy just like feathers.",
        example: "The bird's delicate, feathery wings shone like gems in the sunlight.",
        image: "Soft and light feathery wings of a bird"
      },
      {
        word: "drag",
        part: "verb",
        book: "To pull or be pulled along the ground.",
        simple: "To drag means to pull something heavy along the floor.",
        example: "They had to drag the heavy suitcases up the stairs because the elevator was broken.",
        image: "Dragging a heavy suitcase across the floor"
      },
      {
        word: "lucky",
        part: "adjective",
        book: "Having good things happen.",
        simple: "Lucky means having good luck or fortunate things happen.",
        example: "Jenny was lucky to find her missing ring in the cafe several days later.",
        image: "A happy child holding a lucky four-leaf clover"
      },
      {
        word: "sail",
        part: "verb",
        book: "To travel in a boat.",
        simple: "To sail means to travel across the water on a sailboat.",
        example: "They got onto the boat, ready to sail away to distant islands.",
        image: "A sailboat sailing across blue waters"
      }
    ];

    const scene = document.getElementById("scene");
    const wordElement = document.getElementById("word");
    const partElement = document.getElementById("part");
    const pronounceButton = document.getElementById("pronounce-button");
    const simpleButton = document.getElementById("simple-button");
    const exampleButton = document.getElementById("example-button");
    const simpleAnswer = document.getElementById("simple-answer");
    const exampleAnswer = document.getElementById("example-answer");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const counter = document.getElementById("counter");
    const progress = document.getElementById("progress");
    let currentIndex = 0;

    function showWord() {
      const item = words[currentIndex];
      const column = currentIndex % 5;
      const row = Math.floor(currentIndex / 5);

      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      wordElement.textContent = item.word;
      partElement.textContent = item.part;
      pronounceButton.setAttribute("aria-label", `Hear pronunciation for ${item.word}`);
      scene.setAttribute("aria-label", item.image);
      scene.style.backgroundPosition = `${column * 25}% ${row * 100}%`;
      document.getElementById("book-meaning").textContent = item.book;
      simpleAnswer.textContent = item.simple;
      exampleAnswer.textContent = item.example;
      resetHints();
      counter.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${words.length}`;
      progress.value = currentIndex + 1;
      previousButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === words.length - 1;
    }

    pronounceButton.addEventListener("click", () => {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();
      const pronunciation = new SpeechSynthesisUtterance(words[currentIndex].word);
      pronunciation.lang = "en-US";
      pronunciation.rate = 0.82;
      const englishVoice = window.speechSynthesis.getVoices().find((voice) => voice.lang.toLowerCase().startsWith("en-us"));
      if (englishVoice) pronunciation.voice = englishVoice;
      window.speechSynthesis.speak(pronunciation);
    });

    function toggleHint(button, answer) {
      const isOpen = button.getAttribute("aria-expanded") !== "true";
      button.setAttribute("aria-expanded", String(isOpen));
      if (isOpen) {
        answer.classList.add("is-visible");
        answer.setAttribute("aria-hidden", "false");
      } else {
        answer.classList.remove("is-visible");
        answer.setAttribute("aria-hidden", "true");
      }
      if (isOpen && window.matchMedia("(max-width: 960px)").matches) {
        const targetTop = answer.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.45;
        window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
      }
    }

    function resetHints() {
      for (const [button, answer] of [[simpleButton, simpleAnswer], [exampleButton, exampleAnswer]]) {
        button.setAttribute("aria-expanded", "false");
        answer.classList.remove("is-visible");
        answer.setAttribute("aria-hidden", "true");
      }
    }

    simpleButton.addEventListener("click", () => toggleHint(simpleButton, simpleAnswer));
    exampleButton.addEventListener("click", () => toggleHint(exampleButton, exampleAnswer));

    previousButton.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        showWord();
      }
    });

    nextButton.addEventListener("click", () => {
      if (currentIndex < words.length - 1) {
        currentIndex += 1;
        showWord();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" && currentIndex > 0) {
        currentIndex -= 1;
        showWord();
      } else if (event.key === "ArrowRight" && currentIndex < words.length - 1) {
        currentIndex += 1;
        showWord();
      }
    });

    function hardRefresh() {
      const url = new URL(window.location.href);
      url.searchParams.set("v", Date.now());
      window.location.replace(url.toString());
    }

    showWord();
  </script>
</body>
</html>
