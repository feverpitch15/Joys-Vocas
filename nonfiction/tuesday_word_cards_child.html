<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nonfiction Word Practice</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183436;
      --muted: #52696a;
      --paper: #f4f7f3;
      --line: #cfdbd4;
      --teal: #087e78;
      --coral: #dc684e;
      --yellow: #e2ae36;
      --blue: #557e9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    main {
      width: min(100% - 32px, 1040px);
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--teal);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
    }

    .counter { color: var(--muted); font-size: 16px; font-weight: 700; }

    .progress-track {
      width: 100%;
      height: 10px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 4px;
      background: #dce6df;
    }

    progress {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      appearance: none;
    }

    progress::-webkit-progress-bar { background: #dce6df; }
    progress::-webkit-progress-value { background: var(--teal); }
    progress::-moz-progress-bar { background: var(--teal); }

    .word-panel {
      display: grid;
      grid-template-columns: minmax(220px, 0.85fr) minmax(0, 1.15fr);
      align-items: start;
      gap: 36px;
      min-height: 560px;
      padding: 32px;
      border: 1px solid var(--line);
      border-top: 5px solid var(--teal);
      border-radius: 8px;
      background: #fff;
    }

    .scene {
      width: min(100%, 260px);
      aspect-ratio: 11 / 15;
      justify-self: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background-image: url("images/Gemini_Generated_Image_ubono3ubono3ubon.png");
      background-repeat: no-repeat;
      background-size: 500% 200%;
    }

    .word-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .pronounce-button {
      display: grid;
      width: 48px;
      height: 48px;
      min-height: 48px;
      flex: 0 0 48px;
      place-items: center;
      border-color: var(--line);
      border-radius: 50%;
      padding: 0;
      color: var(--teal);
    }

    .pronounce-button svg { width: 24px; height: 24px; }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .part {
      border-radius: 4px;
      padding: 5px 9px;
      background: #e7f2ed;
      color: #255b53;
      font-size: 15px;
      font-weight: 700;
    }

    .question { margin: 16px 0 22px; color: var(--muted); font-size: 21px; }

    button {
      min-height: 52px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      padding: 11px 18px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #edf5f0; }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    button:disabled { opacity: 0.42; cursor: default; }

    .word-copy { display: flex; flex-direction: column; }
    .meaning { border-top: 1px solid var(--line); padding-top: 16px; }
    .section-label { margin: 0 0 4px; color: var(--teal); font-size: 15px; font-weight: 700; text-transform: uppercase; }
    .answer-text { margin: 0; font-size: 20px; }
    .meaning .answer-text { color: var(--ink); font-weight: 600; }

    .hint-sections {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      margin-top: 10px;
    }

    .hint-section {
      display: flex;
      height: 108px;
      flex-direction: column;
      gap: 4px;
    }

    .hint-button {
      min-height: 46px;
      border-color: var(--line);
      background: #f8faf7;
      color: #788786;
      font-weight: 600;
      text-align: left;
    }

    .hint-button[aria-expanded="true"] {
      border-color: #bfcfc8;
      background: #f1f5f2;
    }

    .hint-answer {
      height: 58px;
      flex: 0 0 58px;
      margin: 0;
      overflow: auto;
      color: var(--muted);
      visibility: hidden;
    }

    .hint-answer.is-visible { visibility: visible; }

    nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    @media (max-width: 620px) {
      main { padding-top: 18px; padding-bottom: 260px; }
      header { align-items: start; }
      .word-panel { grid-template-columns: 1fr; gap: 20px; min-height: 0; padding: 20px; }
      .scene { width: min(100%, 190px); }
      h2 { font-size: 42px; }
      .question { margin: 11px 0 16px; }
    }

    @media print {
      .progress-track, nav { display: none; }
      main { width: 100%; padding: 0; }
      .word-panel { border: 0; padding: 0; }
      .hint-button { border: 0; padding: 0; background: transparent; }
      .hint-answer { height: auto; flex-basis: auto; overflow: visible; visibility: visible; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Nonfiction · Unit 3-11</p>
        <h1>Word Practice</h1>
      </div>
      <span class="counter" id="counter" aria-live="polite">01 / 10</span>
    </header>

    <div class="progress-track">
      <progress id="progress" value="1" max="10" aria-label="Word progress">1 of 10</progress>
    </div>

    <section class="word-panel" aria-live="polite">
      <div class="scene" id="scene" role="img" aria-label="Vocabulary illustration"></div>
      <div class="word-copy">
        <div class="word-meta">
          <h2 id="word">tusk</h2>
          <span class="part" id="part">noun</span>
          <button class="pronounce-button" id="pronounce-button" type="button" aria-label="Hear pronunciation for tusk" title="Hear pronunciation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
          </button>
        </div>
        <p class="question">What does it mean?</p>
        <section class="meaning">
          <p class="section-label">Meaning</p>
          <p class="answer-text" id="book-meaning"></p>
        </section>
        <div class="hint-sections" aria-label="Extra vocabulary hints">
          <section class="hint-section">
            <button class="hint-button" id="simple-button" type="button" aria-expanded="false" aria-controls="simple-answer">In simple words</button>
            <p class="answer-text hint-answer" id="simple-answer" aria-hidden="true"></p>
          </section>
          <section class="hint-section">
            <button class="hint-button" id="example-button" type="button" aria-expanded="false" aria-controls="example-answer">Example</button>
            <p class="answer-text hint-answer" id="example-answer" aria-hidden="true"></p>
          </section>
        </div>
      </div>
    </section>

    <nav aria-label="Word navigation">
      <button id="previous-button" type="button" aria-label="Previous word">← Previous</button>
      <button id="next-button" type="button" aria-label="Next word">Next →</button>
    </nav>
  </main>

  <script>
    const words = [
      {
        word: "tusk",
        part: "noun",
        book: "A large tooth that sticks out of an animal's mouth.",
        simple: "A tusk is a long tooth outside an animal's mouth.",
        example: "The elephant used its tusk to dig in the dirt.",
        image: "An elephant with a long tusk"
      },
      {
        word: "unfortunate",
        part: "adjective",
        book: "Unlucky or sad.",
        simple: "It means something sad or bad happened.",
        example: "It was unfortunate that rain canceled our picnic.",
        image: "A rainy picnic"
      },
      {
        word: "native",
        part: "adjective",
        book: "Originally from a place.",
        simple: "A native animal first lived in that place.",
        example: "Koalas are native to Australia.",
        image: "A koala in its native place"
      },
      {
        word: "pick",
        part: "verb",
        book: "To select, choose, or say you want something from a place.",
        simple: "To pick means to choose the one you want.",
        example: "I picked a blue shirt from the closet.",
        image: "A child picking one shirt"
      },
      {
        word: "root",
        part: "noun",
        book: "The part of a plant that grows underground.",
        simple: "A root is the part of a plant under the ground.",
        example: "The plant's roots spread deep under the soil.",
        image: "A plant with roots underground"
      },
      {
        word: "crack",
        part: "verb",
        book: "To make a small break in something.",
        simple: "To crack means to make a small break.",
        example: "I cracked the egg into a bowl.",
        image: "An egg with a small crack"
      },
      {
        word: "nibble",
        part: "verb",
        book: "To take small bites from something.",
        simple: "To nibble means to eat with tiny bites.",
        example: "The rabbit nibbled a carrot.",
        image: "A rabbit nibbling a carrot"
      },
      {
        word: "illegal",
        part: "adjective",
        book: "Against the law.",
        simple: "Illegal means the law says you must not do it.",
        example: "It is illegal to take things from a store without paying.",
        image: "A law book with a prohibition sign"
      },
      {
        word: "rescue",
        part: "verb",
        book: "To save someone from something.",
        simple: "To rescue means to save someone who is in danger.",
        example: "The lifeguard rescued the swimmer from the water.",
        image: "A lifeguard rescuing a swimmer"
      },
      {
        word: "under arrest",
        part: "phrase",
        book: "When the police take a person to jail.",
        simple: "It means the police caught the person and took them to jail.",
        example: "The news said the man was under arrest.",
        image: "A police officer making an arrest"
      }
    ];

    const scene = document.getElementById("scene");
    const wordElement = document.getElementById("word");
    const partElement = document.getElementById("part");
    const pronounceButton = document.getElementById("pronounce-button");
    const simpleButton = document.getElementById("simple-button");
    const exampleButton = document.getElementById("example-button");
    const simpleAnswer = document.getElementById("simple-answer");
    const exampleAnswer = document.getElementById("example-answer");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const counter = document.getElementById("counter");
    const progress = document.getElementById("progress");
    let currentIndex = 0;

    function showWord() {
      const item = words[currentIndex];
      const column = currentIndex % 5;
      const row = Math.floor(currentIndex / 5);

      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      wordElement.textContent = item.word;
      partElement.textContent = item.part;
      pronounceButton.setAttribute("aria-label", `Hear pronunciation for ${item.word}`);
      scene.setAttribute("aria-label", item.image);
      scene.style.backgroundPosition = `${column * 25}% ${row * 100}%`;
      document.getElementById("book-meaning").textContent = item.book;
      simpleAnswer.textContent = item.simple;
      exampleAnswer.textContent = item.example;
      resetHints();
      counter.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${words.length}`;
      progress.value = currentIndex + 1;
      previousButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === words.length - 1;
    }

    pronounceButton.addEventListener("click", () => {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();
      const pronunciation = new SpeechSynthesisUtterance(words[currentIndex].word);
      pronunciation.lang = "en-US";
      pronunciation.rate = 0.82;
      const englishVoice = window.speechSynthesis.getVoices().find((voice) => voice.lang.toLowerCase().startsWith("en-us"));
      if (englishVoice) pronunciation.voice = englishVoice;
      window.speechSynthesis.speak(pronunciation);
    });

    function toggleHint(button, answer) {
      const isOpen = button.getAttribute("aria-expanded") !== "true";
      button.setAttribute("aria-expanded", String(isOpen));
      answer.classList.toggle("is-visible", isOpen);
      answer.setAttribute("aria-hidden", String(!isOpen));
      if (isOpen && window.matchMedia("(max-width: 620px)").matches) {
        const targetTop = answer.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.45;
        window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
      }
    }

    function resetHints() {
      for (const [button, answer] of [[simpleButton, simpleAnswer], [exampleButton, exampleAnswer]]) {
        button.setAttribute("aria-expanded", "false");
        answer.classList.remove("is-visible");
        answer.setAttribute("aria-hidden", "true");
      }
    }

    simpleButton.addEventListener("click", () => toggleHint(simpleButton, simpleAnswer));
    exampleButton.addEventListener("click", () => toggleHint(exampleButton, exampleAnswer));

    previousButton.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        showWord();
      }
    });

    nextButton.addEventListener("click", () => {
      if (currentIndex < words.length - 1) {
        currentIndex += 1;
        showWord();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" && currentIndex > 0) {
        currentIndex -= 1;
        showWord();
      } else if (event.key === "ArrowRight" && currentIndex < words.length - 1) {
        currentIndex += 1;
        showWord();
      }
    });

    showWord();
  </script>
</body>
</html>
