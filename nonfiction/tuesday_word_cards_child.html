<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Nonfiction Word Practice</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183436;
      --muted: #52696a;
      --paper: #f4f7f3;
      --line: #cfdbd4;
      --teal: #087e78;
      --coral: #dc684e;
      --yellow: #e2ae36;
      --blue: #557e9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    main {
      width: min(100% - 32px, 1040px);
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--teal);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
    }

    .counter { color: var(--muted); font-size: 16px; font-weight: 700; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid #bfcfc8;
      border-radius: 18px;
      background: #fff;
      color: var(--teal);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-btn:hover {
      border-color: var(--teal);
      background: #f0f7f4;
    }

    .nav-btn:active {
      background: #e2f0ea;
      transform: scale(0.96);
    }

    .home-btn {
      color: #3b5250;
    }

    .refresh-button svg {
      transition: transform 0.3s ease;
    }

    .refresh-button:active svg {
      transform: rotate(180deg);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 4px;
      background: #dce6df;
    }

    progress {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      appearance: none;
    }

    progress::-webkit-progress-bar { background: #dce6df; }
    progress::-webkit-progress-value { background: var(--teal); }
    progress::-moz-progress-bar { background: var(--teal); }

    .word-panel {
      display: grid;
      grid-template-columns: minmax(220px, 0.85fr) minmax(0, 1.15fr);
      align-items: start;
      gap: 36px;
      min-height: 560px;
      padding: 32px;
      border: 1px solid var(--line);
      border-top: 5px solid var(--teal);
      border-radius: 8px;
      background: #fff;
    }

    .scene {
      width: min(100%, 260px);
      aspect-ratio: 11 / 15;
      justify-self: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background-image: url("images/Gemini_Generated_Image_ubono3ubono3ubon.png?v=20261124_v2");
      background-repeat: no-repeat;
      background-size: 500% 200%;
    }

    .word-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .pronounce-button {
      display: grid;
      width: 48px;
      height: 48px;
      min-height: 48px;
      flex: 0 0 48px;
      place-items: center;
      border-color: var(--line);
      border-radius: 50%;
      padding: 0;
      color: var(--teal);
    }

    .pronounce-button svg { width: 24px; height: 24px; }

    .meaning-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meaning-row .answer-text {
      flex: 1;
    }

    .pronounce-button.mini-pronounce {
      width: 38px;
      height: 38px;
      min-height: 38px;
      flex: 0 0 38px;
      border-color: var(--line);
      color: var(--teal);
    }

    .pronounce-button.mini-pronounce svg {
      width: 19px;
      height: 19px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .part {
      border-radius: 4px;
      padding: 5px 9px;
      background: #e7f2ed;
      color: #255b53;
      font-size: 15px;
      font-weight: 700;
    }

    .question { margin: 16px 0 22px; color: var(--muted); font-size: 21px; }

    button {
      min-height: 52px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      padding: 11px 18px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #edf5f0; }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    button:disabled { opacity: 0.42; cursor: default; }

    .word-copy { display: flex; flex-direction: column; }
    .meaning { border-top: 1px solid var(--line); padding-top: 16px; }
    .section-label { margin: 0 0 4px; color: var(--teal); font-size: 15px; font-weight: 700; text-transform: uppercase; }
    .answer-text { margin: 0; font-size: 20px; }
    .meaning .answer-text { color: var(--ink); font-weight: 600; }

    .hint-sections {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .hint-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hint-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 16px;
      background: #f8faf7;
      color: var(--ink);
      font-weight: 700;
      text-align: left;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .hint-button::after {
      content: "▼";
      font-size: 11px;
      color: var(--teal);
      transition: transform 0.2s ease;
    }

    .hint-button[aria-expanded="true"] {
      border-color: var(--teal);
      background: #eaf3f0;
      color: var(--teal);
    }

    .hint-button[aria-expanded="true"]::after {
      transform: rotate(180deg);
    }

    .hint-answer {
      display: none;
      margin: 0;
      padding: 12px 16px;
      border-radius: 6px;
      background: #f4f8f6;
      border-left: 4px solid var(--teal);
      color: var(--ink);
      font-size: 19px;
      line-height: 1.45;
    }

    .hint-answer.is-visible {
      display: block !important;
    }

    nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    @media (max-width: 620px) {
      main { padding-top: 18px; padding-bottom: 260px; }
      header { align-items: start; }
      .word-panel { grid-template-columns: 1fr; gap: 20px; min-height: 0; padding: 20px; }
      .scene { width: min(100%, 190px); }
      h2 { font-size: 42px; }
      .question { margin: 11px 0 16px; }
    }

    @media print {
      .progress-track, nav { display: none; }
      main { width: 100%; padding: 0; }
      .word-panel { border: 0; padding: 0; }
      .hint-button { border: 0; padding: 0; background: transparent; }
      .hint-answer { height: auto; flex-basis: auto; overflow: visible; visibility: visible; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Nonfiction · Unit 4-8</p>
        <h1>Word Practice</h1>
      </div>
      <div class="header-actions">
        <a class="nav-btn home-btn" href="../index.html" title="메인 홈으로 이동" aria-label="홈으로">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>홈으로</span>
        </a>
        <button class="nav-btn refresh-button" id="refresh-button" type="button" onclick="hardRefresh()" title="최신 단어 카드로 새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          <span>새로고침</span>
        </button>
        <span class="counter" id="counter" aria-live="polite">01 / 10</span>
      </div>
    </header>

    <div class="progress-track">
      <progress id="progress" value="1" max="10" aria-label="Word progress">1 of 10</progress>
    </div>

    <section class="word-panel" aria-live="polite">
      <div class="scene" id="scene" role="img" aria-label="Vocabulary illustration"></div>
      <div class="word-copy">
        <div class="word-meta">
          <h2 id="word">in tears</h2>
          <span class="part" id="part">idiom</span>
          <button class="pronounce-button" id="pronounce-button" type="button" aria-label="Hear pronunciation for in tears" title="Hear pronunciation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
          </button>
        </div>
        <p class="question">What does it mean?</p>
        <section class="meaning">
          <p class="section-label">Meaning</p>
          <div class="meaning-row">
            <p class="answer-text" id="book-meaning"></p>
            <button class="pronounce-button mini-pronounce" id="meaning-pronounce-button" type="button" aria-label="Hear meaning" title="Hear meaning">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
            </button>
          </div>
        </section>
        <div class="hint-sections" aria-label="Extra vocabulary hints">
          <section class="hint-section">
            <button class="hint-button" id="simple-button" type="button" aria-expanded="false" aria-controls="simple-answer"><span>In simple words</span></button>
            <p class="answer-text hint-answer" id="simple-answer" aria-hidden="true"></p>
          </section>
          <section class="hint-section">
            <button class="hint-button" id="example-button" type="button" aria-expanded="false" aria-controls="example-answer"><span>Example</span></button>
            <p class="answer-text hint-answer" id="example-answer" aria-hidden="true"></p>
          </section>
        </div>
      </div>
    </section>

    <nav aria-label="Word navigation">
      <button id="previous-button" type="button" aria-label="Previous word">← Previous</button>
      <button id="next-button" type="button" aria-label="Next word">Next →</button>
    </nav>
  </main>

  <script>
                            const words = [
      {
            "word": "in tears",
            "part": "idiom",
            "book": "crying; weeping",
            "simple": "To be in tears means having real tears roll down your cheeks because you feel sad or touched.",
            "example": "I was in tears when I learned that my best friend was leaving the country. I'd miss her so much!",
            "image": "A caring child with tear drops rolling down cheeks waving goodbye to a best friend"
      },
      {
            "word": "tough",
            "part": "adjective",
            "book": "difficult; hard to do",
            "simple": "Tough means very hard and challenging to do or solve.",
            "example": "That test was really tough! I didn't know how to answer most of the questions.",
            "image": "A child sitting at a desk scratching head over a difficult puzzle test"
      },
      {
            "word": "sturdy",
            "part": "adjective",
            "book": "strongly and solidly built",
            "simple": "Sturdy describes something built so strong and solid that it does not wobble or break easily.",
            "example": "The new bridge over the river was strong and sturdy. It needed to carry lots of weight.",
            "image": "A solid strong stone bridge over a river carrying heavy weight with rock pillars"
      },
      {
            "word": "sickly",
            "part": "adjective",
            "book": "weak and often ill",
            "simple": "Sickly describes someone or a creature that feels weak, unhealthy, and needs gentle care.",
            "example": "The baby duck was sickly and needed to be cared for. Gemma nursed it back to health.",
            "image": "A frail baby duckling cozy in a warm towel being nursed with a medicine dropper"
      },
      {
            "word": "hut",
            "part": "noun",
            "book": "a small, simple house or shelter",
            "simple": "A hut is a small, cozy shelter built simply out of wood or thatch.",
            "example": "The witch lived in a small, wooden hut in the middle of the forest.",
            "image": "A small rustic wooden log hut in a green forest with gentle smoke curling from its chimney"
      },
      {
            "word": "improve",
            "part": "verb",
            "book": "to get better at something",
            "simple": "To improve means to practice and grow better and better at doing something!",
            "example": "I want to improve my reading skills, so I'm going to practice every night before bed.",
            "image": "A happy child reading a book with confidence next to a rising star progress chart"
      },
      {
            "word": "furious",
            "part": "adjective",
            "book": "extremely angry",
            "simple": "Furious means super, extraordinarily angry, so angry that you feel like steam is coming out of your ears!",
            "example": "Jamie was furious when his sister broke his phone. I'd never seen him so angry.",
            "image": "A child with an exaggerated furious face, red cheeks, and steam from ears because a toy broke"
      },
      {
            "word": "delicate",
            "part": "adjective",
            "book": "easily broken or damaged; fragile",
            "simple": "Delicate describes something very fragile that needs gentle care so it will not break.",
            "example": "Please be careful with that vase, it's very delicate. If you drop it, it will easily break.",
            "image": "A child carefully walking on tiptoes while cradling a fragile glass vase with both hands"
      },
      {
            "word": "heap",
            "part": "verb",
            "book": "to put in a large pile",
            "simple": "To heap means to gather and pile a lot of things into a tall, big stack.",
            "example": "I heaped the branches and leaves into a big pile, ready to put in the trash.",
            "image": "A tall huge heap of autumn leaves and tree branches piled up next to a rake"
      },
      {
            "word": "voice",
            "part": "noun",
            "book": "the sound made by a person speaking or singing",
            "simple": "A voice is the lovely sound made when someone speaks or sings with their mouth.",
            "example": "The singer has a beautiful voice. She's famous for her amazing singing skills.",
            "image": "A singer singing into a microphone with sparkling golden musical notes floating into the air"
      }
];

    const scene = document.getElementById("scene");
    const wordElement = document.getElementById("word");
    const partElement = document.getElementById("part");
    const pronounceButton = document.getElementById("pronounce-button");
    const meaningPronounceButton = document.getElementById("meaning-pronounce-button");
    const simpleButton = document.getElementById("simple-button");
    const exampleButton = document.getElementById("example-button");
    const simpleAnswer = document.getElementById("simple-answer");
    const exampleAnswer = document.getElementById("example-answer");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const counter = document.getElementById("counter");
    const progress = document.getElementById("progress");
    let currentIndex = 0;

    function showWord() {
      const item = words[currentIndex];
      const column = currentIndex % 5;
      const row = Math.floor(currentIndex / 5);

      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      wordElement.textContent = item.word;
      partElement.textContent = item.part;
      pronounceButton.setAttribute("aria-label", `Hear pronunciation for ${item.word}`);
      meaningPronounceButton.setAttribute("aria-label", `Hear meaning: ${item.book}`);
      scene.setAttribute("aria-label", item.image);
      scene.style.backgroundPosition = `${column * 25}% ${row * 100}%`;
      document.getElementById("book-meaning").textContent = item.book;
      simpleAnswer.textContent = item.simple;
      exampleAnswer.textContent = item.example;
      resetHints();
      counter.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${words.length}`;
      progress.value = currentIndex + 1;
      previousButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === words.length - 1;
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();
      const pronunciation = new SpeechSynthesisUtterance(text);
      pronunciation.lang = "en-US";
      pronunciation.rate = 0.82;
      const englishVoice = window.speechSynthesis.getVoices().find((voice) => voice.lang.toLowerCase().startsWith("en-us"));
      if (englishVoice) pronunciation.voice = englishVoice;
      window.speechSynthesis.speak(pronunciation);
    }

    pronounceButton.addEventListener("click", () => {
      speakText(words[currentIndex].word);
    });

    meaningPronounceButton.addEventListener("click", () => {
      speakText(words[currentIndex].book);
    });

    function toggleHint(button, answer) {
      const isOpen = button.getAttribute("aria-expanded") !== "true";
      button.setAttribute("aria-expanded", String(isOpen));
      if (isOpen) {
        answer.classList.add("is-visible");
        answer.setAttribute("aria-hidden", "false");
      } else {
        answer.classList.remove("is-visible");
        answer.setAttribute("aria-hidden", "true");
      }
      if (isOpen && window.matchMedia("(max-width: 960px)").matches) {
        const targetTop = answer.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.45;
        window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
      }
    }

    function resetHints() {
      for (const [button, answer] of [[simpleButton, simpleAnswer], [exampleButton, exampleAnswer]]) {
        button.setAttribute("aria-expanded", "false");
        answer.classList.remove("is-visible");
        answer.setAttribute("aria-hidden", "true");
      }
    }

    simpleButton.addEventListener("click", () => toggleHint(simpleButton, simpleAnswer));
    exampleButton.addEventListener("click", () => toggleHint(exampleButton, exampleAnswer));

    previousButton.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        showWord();
      }
    });

    nextButton.addEventListener("click", () => {
      if (currentIndex < words.length - 1) {
        currentIndex += 1;
        showWord();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" && currentIndex > 0) {
        currentIndex -= 1;
        showWord();
      } else if (event.key === "ArrowRight" && currentIndex < words.length - 1) {
        currentIndex += 1;
        showWord();
      }
    });

    function hardRefresh() {
      const url = new URL(window.location.href);
      url.searchParams.set("v", Date.now());
      window.location.replace(url.toString());
    }

    const urlParams = new URLSearchParams(window.location.search);
    const cacheKey = urlParams.get("v") || "20261124_v2";
    scene.style.backgroundImage = `url("images/Gemini_Generated_Image_ubono3ubono3ubon.png?v=${cacheKey}")`;

    showWord();
  </script>
</body>
</html>
